name: Release NuGet

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish (for example v0.1.0)
        required: true
        type: string

jobs:
  release:
    name: Pack & Publish
    runs-on: ubuntu-latest
    env:
      RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
    permissions:
      contents: read
      packages: write
      id-token: write  # Required for OIDC NuGet login

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}
          fetch-depth: 0  # MinVer needs full history to derive version from tags

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - name: Setup Node.js (for dashboard build)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Restore
        run: dotnet restore AlmostServiceBus.sln

      - name: Build
        run: dotnet build AlmostServiceBus.sln --configuration Release --no-restore

      - name: Test
        run: |
          dotnet test AlmostServiceBus.sln \
            --configuration Release \
            --no-build \
            --filter "FullyQualifiedName!~RealAsbConformanceTests"

      - name: Pack
        run: |
          dotnet pack src/AlmostServiceBus.Core --configuration Release --no-build --output ./nupkgs
          dotnet pack src/AlmostServiceBus.TestHost --configuration Release --no-build --output ./nupkgs
          dotnet pack src/AlmostServiceBus.Aspire.Hosting --configuration Release --no-build --output ./nupkgs

      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet.org
        run: |
          dotnet nuget push ./nupkgs/*.nupkg \
            --api-key ${{ steps.login.outputs.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
